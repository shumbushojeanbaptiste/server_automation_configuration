<!DOCTYPE html>
<html>
<head>
  <title>Retry Pending Videos</title>

  <style>

    body{
      font-family:Arial;
      padding:30px;
      background:#f4f4f4;
    }

    .box{
      background:#fff;
      padding:20px;
      border-radius:10px;
      max-width:500px;
    }

    button{
      padding:12px 20px;
      border:none;
      background:#1e88e5;
      color:#fff;
      cursor:pointer;
      border-radius:5px;
      font-size:16px;
    }

    button:disabled{
      background:#999;
      cursor:not-allowed;
    }

    .progress{
      width:100%;
      height:25px;
      background:#ddd;
      border-radius:20px;
      overflow:hidden;
      margin-top:20px;
    }

    .progress-bar{
      width:0%;
      height:100%;
      background:green;
      transition:0.3s;
    }

    #status{
      margin-top:15px;
      font-weight:bold;
    }

    .loader{
      width:16px;
      height:16px;
      border:3px solid #ddd;
      border-top:3px solid #1e88e5;
      border-radius:50%;
      display:inline-block;
      animation:spin 1s linear infinite;
      margin-right:5px;
    }

    @keyframes spin{
      100%{
        transform:rotate(360deg);
      }
    }

  </style>

</head>

<body>

<div class="box">

  <h2>Retry Pending Video Conversion</h2>

  <button id="retryBtn">
    Run Pending Videos
  </button>

  <p id="status"></p>

  <div class="progress">
    <div
      id="progressBar"
      class="progress-bar">
    </div>
  </div>

</div>


<script>

const retryBtn =
  document.getElementById("retryBtn");

const statusText =
  document.getElementById("status");

const progressBar =
  document.getElementById("progressBar");


retryBtn.addEventListener("click", async () => {

  retryBtn.disabled = true;

  progressBar.style.width = "0%";

  statusText.innerHTML =
    '<span class="loader"></span> Starting conversion...';

  try {

    // run retry endpoint
    const response = await fetch(
      "https://rayon.maafricapay.com/api/videos/retry",
      {
        method:"POST"
      }
    );

    const data = await response.json();

    console.log(data);

    // fake progress animation while server processes
    let percent = 0;

    const interval = setInterval(() => {

      percent += 5;

      if(percent > 95){
        percent = 95;
      }

      progressBar.style.width =
        percent + "%";

      statusText.innerHTML =
        '<span class="loader"></span> Processing videos... ' +
        percent + "%";

    }, 2000);


    // wait some time
    // because backend processing is async
    setTimeout(() => {

      clearInterval(interval);

      progressBar.style.width = "100%";

      statusText.innerHTML =
        "✅ Pending videos processed successfully";

      retryBtn.disabled = false;

    }, 40000); // 40 sec


  } catch (err) {

    console.error(err);

    statusText.innerHTML =
      "❌ Failed to start processing";

    retryBtn.disabled = false;

  }

});

</script>

</body>
</html>
